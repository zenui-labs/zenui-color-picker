<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ColorPicker for React by ZenUI Labs</title>
    <meta name="description"
          content="A dependency-free React color picker. Wheel, hue box and hue slider variants, alpha, five color formats, history, favorites and CSS-variable theming."/>
    <meta name="author" content="ZenUI Labs"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)"/>
    <link rel="canonical" href="https://color-picker.zenui.net/"/>

    <meta property="og:title" content="ColorPicker for React by ZenUI Labs"/>
    <meta property="og:description"
          content="Wheel, hue box or slider. Alpha, five formats, history and favorites, themed with CSS variables."/>
    <meta property="og:image" content="https://color-picker.zenui.net/og/og.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="The ColorPicker wheel variant next to a paint chip, with the headline Pick colors in any format, styled your way."/>
    <meta property="og:url" content="https://color-picker.zenui.net/"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="ZenUI ColorPicker"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="ColorPicker for React by ZenUI Labs"/>
    <meta name="twitter:description"
          content="A dependency-free React color picker with alpha, five formats and CSS-variable theming."/>
    <meta name="twitter:image" content="https://color-picker.zenui.net/og/og.png"/>
    <meta name="twitter:image:alt" content="The ColorPicker wheel variant next to a paint chip, with the headline Pick colors in any format, styled your way."/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"/>

    <script>
        // Apply the saved or system theme before first paint, so there is no flash.
        try {
            var saved = localStorage.getItem('zcp-theme');
            var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
        }
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
